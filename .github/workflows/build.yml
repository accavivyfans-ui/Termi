name: Build IPA

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Termi.xcodeproj \
            -scheme Termi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Termi.app Payload/
          zip -qry Termi.ipa Payload
          ls -la Termi.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Termi-ipa
          path: Termi.ipa

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep MARKETING_VERSION project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Termi.ipa --title "Termi $VER" --notes "Termi $VER (unsigned IPA) — ${GITHUB_SHA::7}" --latest
